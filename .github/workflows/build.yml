name: Build plugin

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Run filter / sync unit tests (gcc + ASan/UBSan)
        run: make -C tests test

  build:
    runs-on: ubuntu-24.04
    needs: host-tests
    steps:
      - uses: actions/checkout@v5

      - name: Build toolchain image (devkitPPC + wut + WUPS)
        run: docker build . -t builder

      - name: Build release plugin
        run: |
          docker run --rm -v "${PWD}:/project" builder make
          test -f GamePadDriftFix.wps

      - name: Check WUPS metadata and .wps header
        run: |
          docker run --rm -v "${PWD}:/project" builder \
            sh -c '"$DEVKITPPC"/bin/powerpc-eabi-readelf -p .wups.meta GamePadDriftFix.elf' | tee meta.txt
          grep -q "wups 0.9.1" meta.txt
          # wups_rules patches 'PL' into the RPL ident at offset 9.
          test "$(dd if=GamePadDriftFix.wps bs=1 skip=9 count=2 status=none)" = "PL"

      - name: Build debug (UDP logging) plugin
        run: |
          mkdir -p out
          cp GamePadDriftFix.wps out/
          docker run --rm -v "${PWD}:/project" builder make clean
          docker run --rm -v "${PWD}:/project" builder make DEBUG=1 TARGET=GamePadDriftFix_debug
          cp GamePadDriftFix_debug.wps out/

      - uses: actions/upload-artifact@v4
        with:
          name: GamePadDriftFix-${{ github.sha }}
          path: out/*.wps
          if-no-files-found: error
